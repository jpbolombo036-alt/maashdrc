# ============================================================
# MAASH — Configuration Apache pour LWS
# ============================================================
<VirtualHost *:80>
    ServerName maashprosoc.cd
    DocumentRoot /var/www/maash-site

    # CORS (pour l'API PROSOC si nécessaire)
    Header set Access-Control-Allow-Origin "*"
    Header set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
    Header set Access-Control-Allow-Headers "*"

    # Compression gzip
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/plain text/css text/xml text/javascript application/json application/javascript application/xml application/xml+rss image/svg+xml
    </IfModule>

    # Configuration autonome : ne pas cumuler avec LWS_HTACCESS.
    <Directory "/var/www/maash-site">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html

        <IfModule mod_expires.c>
            ExpiresActive Off
        </IfModule>

        # Fichiers à nom stable : revalidation, y compris HTML, images et APK.
        Header set Cache-Control "no-cache"
        Header unset Expires

        # Bundles Vite uniquement : empreinte dans le nom, cache d'un an.
        <FilesMatch "^.+-[A-Za-z0-9_-]{8,}\.(js|css)$">
            Header set Cache-Control "public, max-age=31536000, immutable"
        </FilesMatch>

        <FilesMatch "\.apk$">
            ForceType application/vnd.android.package-archive
        </FilesMatch>

        # Réécriture en contexte répertoire : même comportement que .htaccess.
        RewriteEngine On
        RewriteBase /

        # Block hidden files
        RewriteRule "^\." - [F]

        # Redirect all requests to index.html
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.html [L]
    </Directory>

    # Custom error pages
    ErrorDocument 404 /index.html
    ErrorDocument 500 default
    ErrorDocument 502 default
    ErrorDocument 503 default
    ErrorDocument 504 default
</VirtualHost>
