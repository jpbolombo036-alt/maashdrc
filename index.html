    <meta property="og:locale" content="fr_CD" />

      property="og:description"
      content="MAASH — Mutuelle Autorisée d'Assistance Socio-Humanitaire. Protégés en toute dignité, à bas prix. Programme PROSOC, Kinshasa, République démocratique du Congo."
    />
    <meta property="og:url" content="https://maashprosoc.cd/" />

    />
    <script>
      // Par défaut : mode clair. Le mode sombre ne s'applique que si l'utilisateur l'a choisi.
      ;(function () {
        try {
          if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark')
          }
        } catch (e) {}
      })()
    </script>
