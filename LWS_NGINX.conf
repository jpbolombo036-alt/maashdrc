# ============================================================
# MAASH — Configuration Nginx pour LWS
# ============================================================
server {
    listen 80;
    server_name maashprosoc.cd;
    root /var/www/maash-site;
    index index.html;

    # CORS (pour l'API PROSOC si nécessaire)
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods GET,POST,PUT,DELETE,OPTIONS always;
    add_header Access-Control-Allow-Headers "*";

    # Compression gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml application/xml+rss image/svg+xml;

    # Fichiers statiques optimisés
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets (cache long)
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Type application/javascript;
    }

    # Images
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # APK files (serveur direct)
    location /apk/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Type application/vnd.android.package-archive;
    }

    # Robots & Sitemap
    location ~* \.(txt|xml)$ {
        try_files $uri =404;
        expires 1d;
    }

    # Block access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Custom error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}
